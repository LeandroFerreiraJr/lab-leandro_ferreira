<!doctype html>
<html lang='pt-BR'>
<meta charset=UTF-8>
<meta name='viewport' content= width=device-width, initial scale=1.0>



<head>
    <title>página interessante</title>
    <meta name="description" content="Uma descrição interessante de ser lida"> 
</head>



<body>
    <header id="cabecalho">
        <title class="titulo">Área de Contato do Cliente</title>
        <nav class="menu">
            <a href="#">Ajuda</a> | <a href="#">Sair</a>
        </nav>
    </header>



    <main id="corpo-da-pagina">
        <article class="subtitulo">Envie sua mensagem para a nossa equipe de suporte backend</article>
        
        <form action="/enviar" method="POST">
           <label for="nome">Nome:</label>
           <input type="text" id="nome" required minlength=3>
           <br><br>
           
           <label for="email">Email:</label>
           <input type="email" id="email" required minlength=5>
           <br><br>
     
           <label for="celular">Telefone Celular:</label>      
           <input type="tel" id="celular" pattern="[0-9]{11}"required>
           <br><br>

           <label for="msg">Mensagem:</label>
           <textarea id="msg"></textarea>
           <br><br>
            
           <button type="submit">Enviar<\button>
        </form>
    </main>



    <footer id="rodape">
        Suporte Tech 2026
    </footer>
</body>
</html>
